<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: #0d6efd;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #fff;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #0d6efd;
      color: white;
    }

    button {
      padding: 5px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: #fff;
    }

    .edit {
      background: #ffc107;
      color: #000;
    }

    .delete {
      background: #dc3545;
    }
  </style>
</head>
<body>

<h2>Submitted Applications (Admin Only)</h2>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Mobile</th>
      <th>Course</th>
      <th>Date</th>
      <th>Address</th>
      <th>Action</th> <!-- ✅ added -->
    </tr>
  </thead>
  <tbody id="adminTable"></tbody>
</table>

<script>
  let data = JSON.parse(localStorage.getItem("applications")) || [];
  const table = document.getElementById("adminTable");

  function renderTable() {
    table.innerHTML = "";

    if (data.length === 0) {
      table.innerHTML = "<tr><td colspan='6'>No data available</td></tr>";
      return;
    }

    data.forEach((d, index) => {
      table.innerHTML += `
        <tr>
          <td>${d.name}</td>
          <td>${d.email}</td>
          <td>${d.phone}</td>
          <td>${d.course}</td>
          <td>${d.date}</td>
          <td>${d.address}</td>
          
          <td>
            <button class="edit" onclick="editData(${index})">Edit</button>
            <button class="delete" onclick="deleteData(${index})">Delete</button>
          </td>
        </tr>
      `;
    });
  }

  function deleteData(index) {
    if (confirm("Delete this record?")) {
      data.splice(index, 1);
      localStorage.setItem("applications", JSON.stringify(data));
      renderTable();
    }
  }

  function editData(index) {
    const d = data[index];

    const name = prompt("Edit Name:", d.name);
    const email = prompt("Edit Email:", d.email);
    const phone = prompt("Edit Mobile:", d.phone);
    const course = prompt("Edit Course:", d.course);
    const address = prompt("Edit Address:", d.address);

    if (name && email && phone && course && address) {
      data[index] = { ...d, name, email, phone, course, address };
      localStorage.setItem("applications", JSON.stringify(data));
      renderTable();
    }
  }

  renderTable();
</script>

</body>
</html>
